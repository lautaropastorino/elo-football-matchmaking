<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELO Fútbol 5</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1a6b3a;
    --green-light: #2d9e57;
    --green-dark: #0e3d21;
    --gold: #f0c040;
    --gold-dim: #c9a030;
    --bg: #0d1f14;
    --surface: #142a1c;
    --surface2: #1c3828;
    --border: #2a4e35;
    --text: #e8f0eb;
    --text-dim: #7faa8e;
    --red: #e05555;
    --blue: #4a9edd;
    --team-light: #e8d97a;
    --team-dark: #3a3a3a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(26,107,58,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,107,58,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px 60px;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  header {
    padding: 40px 0 30px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 18px 6px 10px;
    margin-bottom: 16px;
  }

  .logo-ball {
    font-size: 20px;
  }

  .logo-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--green-light);
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 8vw, 72px);
    letter-spacing: 4px;
    line-height: 1;
    color: var(--text);
    text-shadow: 0 0 40px rgba(45,158,87,0.3);
  }

  h1 span {
    color: var(--gold);
  }

  .subtitle {
    margin-top: 8px;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* SECTION TITLES */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* RANKING TABLE */
  .ranking-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 4px;
    margin-bottom: 48px;
  }

  .ranking-table thead th {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--text-dim);
    padding: 6px 14px;
    text-align: left;
    font-weight: 400;
  }

  .ranking-table thead th:last-child,
  .ranking-table thead th:nth-child(3),
  .ranking-table thead th:nth-child(4),
  .ranking-table thead th:nth-child(5) {
    text-align: center;
  }

  .ranking-table tbody tr {
    background: var(--surface);
    transition: background 0.15s;
    cursor: pointer;
  }

  .ranking-table tbody tr:hover {
    background: var(--surface2);
  }

  .ranking-table tbody tr.selected {
    background: rgba(45,158,87,0.18);
    outline: 1.5px solid var(--green-light);
    outline-offset: -1.5px;
  }

  .ranking-table tbody tr.selected td:first-child {
    border-left: 3px solid var(--green-light);
  }

  .ranking-table tbody td {
    padding: 12px 14px;
    font-size: 14px;
    border-left: 3px solid transparent;
  }

  .rank-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--text-dim);
    width: 40px;
    text-align: center;
  }

  .rank-1 .rank-num { color: var(--gold); }
  .rank-2 .rank-num { color: #b0c8d0; }
  .rank-3 .rank-num { color: #c08050; }

  .player-name {
    font-weight: 600;
    font-size: 15px;
  }

  .elo-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--gold);
  }

  .elo-cell {
    text-align: center;
    vertical-align: middle;
  }

  .stat-cell {
    text-align: center;
    font-size: 13px;
  }

  .stat-w { color: var(--green-light); font-weight: 600; }
  .stat-d { color: var(--text-dim); }
  .stat-l { color: var(--red); font-weight: 600; }

  .form-badges {
    display: flex;
    gap: 3px;
    justify-content: flex-end;
    align-items: center;
  }

  .form-badge {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .form-badge.W { background: var(--green-light); }
  .form-badge.D { background: #5a7a65; }
  .form-badge.L { background: var(--red); }
  .form-badge.X { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }

  .select-hint {
    text-align: center;
    margin-bottom: 10px;
  }

  .counter-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 14px;
    color: var(--text-dim);
  }

  .counter-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--text);
    line-height: 1;
  }

  .counter-num.ready {
    color: var(--green-light);
  }

  /* BUTTON */
  .btn-create {
    display: block;
    margin: 20px auto 0;
    background: var(--green-light);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 16px 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(45,158,87,0.3);
  }

  .btn-create:hover:not(:disabled) {
    background: #38c068;
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(45,158,87,0.5);
  }

  .btn-create:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-create:disabled {
    background: var(--surface2);
    color: var(--text-dim);
    box-shadow: none;
    cursor: not-allowed;
  }

  /* TEAMS RESULT */
  #teams-result {
    margin-top: 40px;
  }

  .teams-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0;
    align-items: start;
  }

  .team-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .team-header {
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .team-a .team-header { background: rgba(232,217,122,0.12); border-bottom: 1px solid rgba(232,217,122,0.25); }
  .team-b .team-header { background: rgba(58,58,58,0.4); border-bottom: 1px solid rgba(255,255,255,0.08); }

  .team-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
  }

  .team-a .team-label { color: var(--team-light); }
  .team-b .team-label { color: #aaaaaa; }

  .team-elo-total {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--text-dim);
  }

  .team-players {
    list-style: none;
    padding: 12px 0;
  }

  .team-players li {
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .team-players li:last-child { border-bottom: none; }

  .tp-name { font-weight: 500; }

  .tp-elo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    color: var(--gold);
  }

  .vs-divider {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    gap: 6px;
  }

  .vs-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  .diff-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    white-space: nowrap;
  }

  .diff-badge strong {
    color: var(--gold);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
  }

  .balance-bar {
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }

  .balance-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .bar-container {
    height: 10px;
    background: var(--surface2);
    border-radius: 100px;
    overflow: hidden;
    display: flex;
  }

  .bar-a {
    background: var(--team-light);
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }

  .bar-b {
    background: #6a6a6a;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }

  .bar-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .btn-reshuffle {
    display: block;
    margin: 20px auto 0;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .btn-reshuffle:hover {
    border-color: var(--text-dim);
    color: var(--text);
  }

  /* ELO bar in table */
  .elo-mini-bar-wrap {
    width: 70px;
    height: 4px;
    background: var(--surface2);
    border-radius: 100px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
    margin-left: 6px;
  }
  .elo-mini-bar {
    height: 100%;
    background: var(--gold);
    border-radius: 100px;
  }

  footer {
    margin-top: 60px;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  .footer-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    transition: color 0.15s;
  }

  .footer-link:hover {
    color: var(--text);
  }

  .github-icon {
    width: 16px;
    height: 16px;
    fill: currentColor;
    flex-shrink: 0;
  }

  @media (max-width: 640px) {
    .teams-grid { grid-template-columns: 1fr; }
    .vs-divider { padding: 10px 0; flex-direction: row; justify-content: center; }
    .form-badges { display: none; }
    .ranking-table thead th:nth-child(5) { display: none; }
    .ranking-table tbody td:nth-child(5) { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-badge">
      <span class="logo-ball">⚽</span>
      <span class="logo-label">Sistema de Ranking</span>
    </div>
    <h1>FÚTBOL <span>BAIRES</span></h1>
    <p class="subtitle">Sistema de clasificación ELO · Temporada 2026</p>
  </header>

  <div class="section-title">Ranking ELO</div>
  <table class="ranking-table" id="ranking-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Jugador</th>
        <th>ELO</th>
        <th>PJ / G / E / P</th>
        <th>Forma</th>
      </tr>
    </thead>
    <tbody id="ranking-body"></tbody>
  </table>

  <div class="section-title">Armar Equipos</div>
  <div class="select-hint">
    <div class="counter-badge">
      Seleccionados: <span class="counter-num" id="selected-count">0</span> / 10
    </div>
  </div>

  <button class="btn-create" id="btn-create" disabled onclick="createTeams()">
    ⚡ CREAR EQUIPOS
  </button>

  <div id="teams-result"></div>

  <footer>
    <a href="https://github.com/lautaropastorino" target="_blank" rel="noopener" class="footer-link">
      <svg class="github-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>

  </footer>

<script>
// ─── DATOS ───────────────────────────────────────────────────────────────────
// Resultados: 'W' = ganó, 'D' = empató, 'L' = perdió, 'X' = no jugó
const PLAYERS_DATA = [
  { id:  1, name: "Manuel Diaz",               results: ["L","W","L","L"] },
  { id:  2, name: "Facundo Morazzani",         results: ["L","L","W","L"] },
  { id:  3, name: "Lautaro Pastorino",         results: ["X","X","W","X"] },
  { id:  4, name: "Santiago Seroni",           results: ["L","L","L","X"] },
  { id:  5, name: "Juan Manuel Garcia",        results: ["X","W","X","W"] },
  { id:  6, name: "Franco Boi",                results: ["W","L","W","L"] },
  { id:  7, name: "Marco Braca",               results: ["L","W","W","W"] },
  { id:  8, name: "Matias Nasif",              results: ["X","W","L","X"] },
  { id:  9, name: "Lautaro Barrionuevo",       results: ["W","L","W","W"] },
  { id: 10, name: "Estanislao Chiocconi",      results: ["X","X","L","W"] },
  { id: 11, name: "Mauricio Bergallo",         results: ["W","W","X","L"] },
  { id: 12, name: "Pedro Molina",              results: ["X","X","W","W"] },
  { id: 13, name: "Matías Teitelbaum",         results: ["W","X","X","L"] },
  { id: 14, name: "Juan Ignacio Richiello",    results: ["L","X","X","X"] },
  { id: 15, name: "Manuel Gonzalez Virgili",   results: ["W","L","X","X"] },
];

const MATCHES = [
  { id: 1, team_1: [2,4,14,7,1],   team_2: [15,13,6,9,11] },
  { id: 2, team_1: [1,7,5,8,11],   team_2: [15,2,6,9,4]   },
  { id: 3, team_1: [1,8,10,12,4],  team_2: [3,6,7,9,2]    },
  { id: 4, team_1: [1,2,11,6,13],  team_2: [10,5,9,7,12]    },
];

// ─── ELO ENGINE ──────────────────────────────────────────────────────────────
// K variable por partidos jugados por el jugador: 1-5 → 100, 6-10 → 70, 11+ → 50
const ELO_START = 1200;

function getK(playedCount) {
  if (playedCount <= 5)  return 100;
  if (playedCount <= 10) return 70;
  return 50;
}

// Probabilidad esperada de ganar dado el promedio ELO de cada equipo
// Fórmula ELO clásica: E = 1 / (1 + 10^((eloRival - eloPropio) / 400))
function expectedScore(myTeamAvg, rivalTeamAvg) {
  return 1 / (1 + Math.pow(10, (rivalTeamAvg - myTeamAvg) / 400));
}

function teamAvgElo(ids, eloMap) {
  const total = ids.reduce((s, id) => s + (eloMap[id] ?? ELO_START), 0);
  return total / ids.length;
}

// Calcula el ELO final de todos los jugadores procesando los partidos en orden.
// En cada partido, el ELO de cada equipo se toma ANTES de aplicar los cambios
// del partido (snapshot), luego se actualizan todos juntos.
function buildPlayers() {
  // Mapa id → ELO actual (mutable durante el cálculo)
  const eloMap = {};
  // Mapa id → cantidad de partidos jugados (para determinar K)
  const playedMap = {};

  PLAYERS_DATA.forEach(p => {
    eloMap[p.id]   = ELO_START;
    playedMap[p.id] = 0;
  });

  // Procesar cada partido en orden cronológico
  MATCHES.forEach((match, mIdx) => {
    const t1 = match.team_1;
    const t2 = match.team_2;

    // Snapshot de ELO ANTES del partido (para calcular expectativa justa)
    const avgT1 = teamAvgElo(t1, eloMap);
    const avgT2 = teamAvgElo(t2, eloMap);

    // Resultados del partido para cada equipo según PLAYERS_DATA
    // El resultado en results[mIdx] de cada jugador dice W/L/D/X
    const deltas = {}; // id → delta ELO a aplicar

    [...t1, ...t2].forEach(id => {
      const player = PLAYERS_DATA.find(p => p.id === id);
      const result = player.results[mIdx]; // resultado de este partido

      if (result === 'X') return; // no jugó, sin cambio

      const isTeam1 = t1.includes(id);
      const myAvg     = isTeam1 ? avgT1 : avgT2;
      const rivalAvg  = isTeam1 ? avgT2 : avgT1;

      const E = expectedScore(myAvg, rivalAvg);
      let S;
      if (result === 'W')      S = 1;
      else if (result === 'D') S = 0.5;
      else                     S = 0;

      playedMap[id]++;
      const K = getK(playedMap[id]);
      deltas[id] = Math.round(K * (S - E));
    });

    // Aplicar todos los deltas juntos (snapshot approach)
    Object.entries(deltas).forEach(([id, delta]) => {
      eloMap[id] += delta;
    });
  });

  // Construir objetos finales de jugadores
  return PLAYERS_DATA.map(p => {
    const played = p.results.filter(r => r !== 'X');
    return {
      id:     p.id,
      name:   p.name,
      results: p.results,
      elo:    eloMap[p.id],
      pj:     played.length,
      wins:   played.filter(r => r === 'W').length,
      draws:  played.filter(r => r === 'D').length,
      losses: played.filter(r => r === 'L').length,
    };
  });
}

// ─── BUILD PLAYER OBJECTS ────────────────────────────────────────────────────
const players = buildPlayers();

// Sort by ELO desc
players.sort((a, b) => b.elo - a.elo);

const maxElo = Math.max(...players.map(p => p.elo));
const minElo = Math.min(...players.map(p => p.elo));

// ─── RENDER RANKING ──────────────────────────────────────────────────────────
const tbody = document.getElementById('ranking-body');
const selectedIds = new Set();

players.forEach((p, i) => {
  const row = document.createElement('tr');
  row.dataset.idx = i;
  if (i < 3) row.classList.add(`rank-${i+1}`);

  const pj = p.pj;
  const formLast5 = p.results.slice(-5);
  const formBadges = formLast5.map(r =>
    `<span class="form-badge ${r}">${r === 'X' ? '–' : r}</span>`
  ).join('');

  const barWidth = maxElo === minElo ? 100 :
    Math.round(((p.elo - minElo) / (maxElo - minElo)) * 100);

  row.innerHTML = `
    <td class="rank-num">${i + 1}</td>
    <td class="player-name">${p.name}</td>
    <td class="elo-cell">
      <span class="elo-score">${p.elo}</span>
      <span class="elo-mini-bar-wrap"><span class="elo-mini-bar" style="width:${barWidth}%"></span></span>
    </td>
    <td class="stat-cell">
      ${pj} /
      <span class="stat-w">${p.wins}G</span>
      <span class="stat-d">${p.draws}E</span>
      <span class="stat-l">${p.losses}P</span>
    </td>
    <td><div class="form-badges">${formBadges}</div></td>
  `;

  row.addEventListener('click', () => toggleSelect(i, row));
  tbody.appendChild(row);
});

function toggleSelect(idx, row) {
  if (selectedIds.has(idx)) {
    selectedIds.delete(idx);
    row.classList.remove('selected');
  } else {
    if (selectedIds.size >= 10) return;
    selectedIds.add(idx);
    row.classList.add('selected');
  }
  updateCounter();
}

function updateCounter() {
  const cnt = selectedIds.size;
  const el = document.getElementById('selected-count');
  el.textContent = cnt;
  el.classList.toggle('ready', cnt === 10);
  document.getElementById('btn-create').disabled = cnt !== 10;
}

// ─── TEAM BALANCING ALGORITHM ─────────────────────────────────────────────
// Objective: minimize both the ELO total difference AND the internal variance
// difference between teams. Uses exhaustive search over C(10,5) = 252 combos.

function variance(arr) {
  const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
  return arr.reduce((s, x) => s + (x - mean) ** 2, 0) / arr.length;
}

function balanceScore(teamA, teamB) {
  const totalA = teamA.reduce((s, p) => s + p.elo, 0);
  const totalB = teamB.reduce((s, p) => s + p.elo, 0);
  const totalDiff = Math.abs(totalA - totalB);

  // Variance "fairness": penalize teams where one star dominates
  const varA = variance(teamA.map(p => p.elo));
  const varB = variance(teamB.map(p => p.elo));
  const varDiff = Math.abs(varA - varB);

  // Weighted score: total diff matters more, but variance diff adds penalty
  return totalDiff + varDiff * 0.5;
}

function getCombinations(arr, k) {
  const result = [];
  function bt(start, combo) {
    if (combo.length === k) { result.push([...combo]); return; }
    for (let i = start; i < arr.length; i++) {
      combo.push(arr[i]);
      bt(i + 1, combo);
      combo.pop();
    }
  }
  bt(0, []);
  return result;
}

let lastTeamA = [], lastTeamB = [];

function createTeams() {
  const selected = [...selectedIds].map(i => players[i]);

  const combos = getCombinations(selected, 5);
  let best = null, bestScore = Infinity;

  for (const teamA of combos) {
    const teamASet = new Set(teamA.map(p => p.name));
    const teamB = selected.filter(p => !teamASet.has(p.name));
    const score = balanceScore(teamA, teamB);
    if (score < bestScore) {
      bestScore = score;
      best = { teamA, teamB };
    }
  }

  // Sort each team by ELO desc
  best.teamA.sort((a, b) => b.elo - a.elo);
  best.teamB.sort((a, b) => b.elo - a.elo);

  lastTeamA = best.teamA;
  lastTeamB = best.teamB;

  renderTeams(best.teamA, best.teamB);
}

function renderTeams(teamA, teamB) {
  const totalA = teamA.reduce((s, p) => s + p.elo, 0);
  const totalB = teamB.reduce((s, p) => s + p.elo, 0);
  const diff = Math.abs(totalA - totalB);
  const total = totalA + totalB;
  const pctA = Math.round((totalA / total) * 100);
  const pctB = 100 - pctA;

  const listA = teamA.map(p => `
    <li>
      <span class="tp-name">${p.name}</span>
      <span class="tp-elo">${p.elo}</span>
    </li>`).join('');

  const listB = teamB.map(p => `
    <li>
      <span class="tp-name">${p.name}</span>
      <span class="tp-elo">${p.elo}</span>
    </li>`).join('');

  document.getElementById('teams-result').innerHTML = `
    <div class="section-title">Equipos</div>
    <div class="teams-grid">
      <div class="team-card team-a">
        <div class="team-header">
          <span class="team-label">☀ Equipo Claro</span>
          <span class="team-elo-total">${totalA} pts</span>
        </div>
        <ul class="team-players">${listA}</ul>
      </div>

      <div class="vs-divider">
        <span class="vs-text">VS</span>
        <div class="diff-badge">
          Diferencia<br><strong>${diff}</strong> pts
        </div>
      </div>

      <div class="team-card team-b">
        <div class="team-header">
          <span class="team-label">🌑 Equipo Oscuro</span>
          <span class="team-elo-total">${totalB} pts</span>
        </div>
        <ul class="team-players">${listB}</ul>
      </div>
    </div>

    <div class="balance-bar">
      <div class="balance-label">Balance ELO</div>
      <div class="bar-container">
        <div class="bar-a" style="width:${pctA}%"></div>
        <div class="bar-b" style="width:${pctB}%"></div>
      </div>
      <div class="bar-labels">
        <span style="color:var(--team-light)">Claro ${pctA}%</span>
        <span style="color:#aaaaaa">Oscuro ${pctB}%</span>
      </div>
    </div>

    <button class="btn-reshuffle" onclick="createTeams()">
      🔀 Recalcular equipos
    </button>
  `;

  document.getElementById('teams-result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
